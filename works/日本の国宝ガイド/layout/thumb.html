<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>thumbnail</title>
<style>
/* ============================================================
   Ko-fi Shop サムネイル(1200×1200 正方形)
   5冊並べたときシリーズに見えるよう、この体裁を全城で共通にする。
   差し替えるのは 写真 / 城名 / 英名 / 巻数 の4点のみ。
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1200px; height:1200px; overflow:hidden; }
body { font-family:"IPAPGothic","IPAGothic",sans-serif; position:relative; background:#111; }

.photo { position:absolute; inset:0; }
.photo img { width:100%; height:100%; object-fit:cover; }

/* 上下に締めを入れて文字を確実に読ませる */
.veil { position:absolute; inset:0;
  background:
    linear-gradient(to bottom,
      rgba(10,12,16,.62) 0%,
      rgba(10,12,16,.10) 26%,
      rgba(10,12,16,.00) 45%,
      rgba(10,12,16,.35) 66%,
      rgba(10,12,16,.80) 100%);
}

/* 上部 ── シリーズ表示 */
.head { position:absolute; top:56px; left:64px; right:64px;
  display:flex; align-items:center; gap:22px; color:#fff; }
.no { width:78px; height:78px; flex:0 0 78px;
  border:3px solid rgba(255,255,255,.9); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:34px; font-weight:700; letter-spacing:.02em; }
.series { font-size:27px; letter-spacing:.30em; font-weight:700;
  text-shadow:0 2px 12px rgba(0,0,0,.7); }
.series .sub { display:block; font-size:17px; letter-spacing:.20em;
  opacity:.85; margin-top:7px; font-weight:400; }

/* 下部 ── 城名 */
.foot { position:absolute; left:64px; right:64px; bottom:104px; color:#fff; }
.rule { width:88px; height:5px; background:#e8c46a; margin-bottom:26px; }
.name { font-size:112px; font-weight:700; line-height:1.02;
  letter-spacing:.05em; text-shadow:0 4px 24px rgba(0,0,0,.65); }
.name.en { font-size:88px; letter-spacing:.01em;
  font-family:"DejaVu Sans","Liberation Sans",sans-serif; }
.roman { font-size:26px; letter-spacing:.26em; margin-top:20px; opacity:.93;
  text-shadow:0 2px 12px rgba(0,0,0,.7); }
</style>
</head>
<body>
  <div class="photo"><img src="img/姫路城_連立式天守.jpg" alt=""></div>
  <div class="veil"></div>

  <div class="head">
    <div class="no">01</div>
    <div class="series">国宝五城
      <span class="sub">日本の国宝ガイド</span>
    </div>
  </div>

  <div class="foot">
    <div class="rule"></div>
    <div class="name">姫路城</div>
    <div class="roman">HIMEJI CASTLE ／ 兵庫</div>
  </div>
</body>
</html>
