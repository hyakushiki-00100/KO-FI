<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 900 240" width="900" height="240" font-family="DejaVu Sans, Liberation Sans, sans-serif">
  <title>Types of loophole (sama)</title>

  <!-- White plaster wall -->
  <rect x="0" y="60" width="900" height="230" fill="#f6f3ec" stroke="#d8d2c6" stroke-width="2"/>
  <rect x="0" y="60" width="900" height="10" fill="#e6e0d4"/>
  <rect x="0" y="280" width="900" height="10" fill="#e6e0d4"/>

  <!-- Heading -->

  <!-- Round -->
  <circle cx="140" cy="165" r="34" fill="#2b2b2b"/>
  <text x="140" y="240" font-size="18" font-weight="bold" fill="#2b2b2b" text-anchor="middle">Round</text>
  <text x="140" y="262" font-size="13" fill="#666" text-anchor="middle">for guns</text>

  <!-- Triangular -->
  <polygon points="360,130 397,199 323,199" fill="#2b2b2b"/>
  <text x="360" y="240" font-size="18" font-weight="bold" fill="#2b2b2b" text-anchor="middle">Triangular</text>
  <text x="360" y="262" font-size="13" fill="#666" text-anchor="middle">for guns</text>

  <!-- Square -->
  <rect x="546" y="133" width="68" height="68" fill="#2b2b2b"/>
  <text x="580" y="240" font-size="18" font-weight="bold" fill="#2b2b2b" text-anchor="middle">Square</text>
  <text x="580" y="262" font-size="13" fill="#666" text-anchor="middle">for guns</text>

  <!-- Tall rectangle -->
  <rect x="770" y="112" width="44" height="110" fill="#2b2b2b"/>
  <text x="792" y="240" font-size="18" font-weight="bold" fill="#2b2b2b" text-anchor="middle">Tall</text>
  <text x="792" y="262" font-size="13" fill="#666" text-anchor="middle">for bows</text>

  <!-- Divider -->
  <line x1="686" y1="90" x2="686" y2="260" stroke="#cfc7b8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Notes -->
</svg>
