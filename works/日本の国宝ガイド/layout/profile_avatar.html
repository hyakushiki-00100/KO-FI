<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Ko-fi avatar</title>
<style>
/* ============================================================
   Ko-fi アイコン 800×800
   ⚠️ 円形に切り抜かれて表示されることがある。
      四隅に重要な要素を置かない。小さく表示されても読める字面にする。
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:800px; height:800px; overflow:hidden; }
body { font-family:"IPAPGothic","IPAGothic",sans-serif; position:relative; background:#0d1015; }

.photo { position:absolute; inset:0; }
/* 天守を大きく。アイコンは50〜100pxで表示されることがあり、
   文字は読めなくなるため、シルエットで識別させる */
.photo img { width:100%; height:100%; object-fit:cover;
  object-position:64% 40%; transform:scale(1.34); transform-origin:64% 40%; }

/* 四隅を落として、円形に切り抜かれても自然に見えるようにする */
.veil { position:absolute; inset:0;
  background: radial-gradient(circle at 50% 46%,
    rgba(10,12,16,0) 0%, rgba(10,12,16,0) 52%, rgba(10,12,16,.55) 88%, rgba(10,12,16,.80) 100%); }
</style>
</head>
<body>
  <div class="photo"><img src="img/姫路城_連立式天守.jpg" alt=""></div>
  <div class="veil"></div>
</body>
</html>
